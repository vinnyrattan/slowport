name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go test ./...
      - run: go vet ./...
      - run: go build -trimpath -o slowport.exe .
      - uses: actions/upload-artifact@v4
        with:
          name: slowport-windows-amd64
          path: slowport.exe
